# =============================================================================
# perf-optimizer — Spring Boot 4.1 / Spring AI 2.0 / Amazon Bedrock
# Optimization agent exposed over MCP (SSE). Thin-slice POC: one tool.
# =============================================================================
spring:
  application:
    name: perf-optimizer
  threads:
    virtual:
      enabled: true
  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
      converse:
        chat:
          options:
            model: ${SPRING_AI_BEDROCK_CONVERSE_CHAT_OPTIONS_MODEL:global.anthropic.claude-sonnet-4-6}
            max-tokens: 10000
    # MCP server (WebMVC + SSE). Defaults expose SSE at /sse and messages at
    # /mcp/message. Tools come from the ToolCallbackProvider bean in
    # OptimizerApplication. NOTE: verify exact 2.0 property names on first build.
    mcp:
      server:
        name: perf-optimizer
        version: 1.0.0
        type: SYNC

# Pyroscope endpoint the tool queries for CPU + wall signals (no collector).
PYROSCOPE_URL: ${PYROSCOPE_URL:http://pyroscope.monitoring:4040}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
