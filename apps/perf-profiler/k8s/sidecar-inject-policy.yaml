# Privilege-free profiler-sidecar injection (Kyverno MutatingPolicy, CEL API).
#
# Opt a workload in with the pod-template label `perf-profile/sidecar: "true"`
# and apply — the pod-template change rolls the pods and the new ones get the
# sidecar. No privileged/hostPID container, no root: the sidecar runs as the app's
# UID (JVM dynamic attach requires the same UID as the target; the workshop app runs
# as 1000, see __APP_UID__) with capabilities dropped except SYS_PTRACE, no
# privilege escalation, the runtime seccomp profile and a read-only root filesystem,
# and attaches async-profiler (ctimer + wall) across the shared PID namespace, pushing
# JFR to Pyroscope. The app image is untouched. Proven on Bottlerocket EKS Auto (K8s 1.34).
#
# The sidecar's requests equal its limits (CPU and memory) so that injecting it does
# NOT change the pod's QoS class: a Guaranteed app pod stays Guaranteed. 250m CPU covers
# diagnoseBlocking's 40 jcmd launches in 20 s without throttling the dumps; 384Mi holds
# the /dump server JVM plus a 10-minute JFR ring read into memory.
#
# Scratch volumes: a dedicated emptyDir (`perf-scratch`, sizeLimit 200Mi) is mounted at
# /perf in BOTH the app container and the sidecar. Everything the profiler makes the app
# JVM write (async-profiler agent + rotation files, JFR ring repository, on-demand JFR and
# thread dumps) lands there — never in the app image's filesystem or its /tmp — so the app
# can run with readOnlyRootFilesystem: true and the sidecar reads the files directly. A
# second emptyDir (`perf-tmp`) backs the sidecar's own /tmp (its logs) behind its read-only
# root filesystem.
#
# The profiler is a BAKED image (Amazon Corretto 25 + async-profiler, built from
# apps/perf-profiler) — no runtime download and no init container. The placeholders
# below (__PERF_PROFILER_IMAGE__ pinned by digest, __CLUSTER_NAME__, __APP_UID__,
# __PYROSCOPE_URL__) are substituted by deploy/java-on-amazon-eks/perf-profiler.sh.
#
# CEL authoring notes (both verified on-cluster):
#   1. patchType: ApplyConfiguration CANNOT set atomic fields (env.valueFrom.fieldRef,
#      securityContext.capabilities.add) -> use JSONPatch.
#   2. CEL will not widen heterogeneous map/list literals in a JSONPatch value
#      (it unifies value types eagerly) -> every value is wrapped in dyn(...).
#
# Prereq: Kyverno installed cluster-wide (by perf-profiler.sh / the bootstrap).
# failurePolicy: Ignore so a Kyverno outage never blocks app pods from scheduling.
apiVersion: policies.kyverno.io/v1beta1
kind: MutatingPolicy
metadata:
  name: inject-perf-profiler
spec:
  failurePolicy: Ignore
  # Only mutate Pods directly. Disable pod-controller autogen: our JSONPatch paths
  # are Pod-level (/spec/...), and autogen would also rerun them against Deployment
  # objects at /spec/template/spec/... and fail. Injection happens at Pod admission
  # (label + rollout restart), which is what we want.
  autogen:
    podControllers:
      controllers: ["none"]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
  matchConditions:
    - name: opted-in
      expression: >-
        has(object.metadata.labels) &&
        'perf-profile/sidecar' in object.metadata.labels &&
        object.metadata.labels['perf-profile/sidecar'] == 'true'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [
            JSONPatch{op: "add", path: "/spec/shareProcessNamespace", value: true},
            JSONPatch{
              op: "add",
              path: has(object.spec.volumes) ? "/spec/volumes/-" : "/spec/volumes",
              value: has(object.spec.volumes)
                ? dyn({"name": dyn("perf-scratch"), "emptyDir": dyn({"sizeLimit": dyn("200Mi")})})
                : dyn([dyn({"name": dyn("perf-scratch"), "emptyDir": dyn({"sizeLimit": dyn("200Mi")})})])
            },
            JSONPatch{
              op: "add",
              path: "/spec/volumes/-",
              value: dyn({"name": dyn("perf-tmp"), "emptyDir": dyn({"sizeLimit": dyn("50Mi")})})
            },
            JSONPatch{
              op: "add",
              path: has(object.spec.containers[0].volumeMounts) ? "/spec/containers/0/volumeMounts/-" : "/spec/containers/0/volumeMounts",
              value: has(object.spec.containers[0].volumeMounts)
                ? dyn({"name": dyn("perf-scratch"), "mountPath": dyn("/perf")})
                : dyn([dyn({"name": dyn("perf-scratch"), "mountPath": dyn("/perf")})])
            },
            JSONPatch{op: "add", path: "/spec/containers/-", value: dyn({
              "name": dyn("perf-profiler"),
              "image": dyn("__PERF_PROFILER_IMAGE__"),
              "imagePullPolicy": dyn("IfNotPresent"),
              "ports": dyn([dyn({"name": dyn("dump"), "containerPort": dyn(9100)})]),
              "securityContext": dyn({
                "runAsUser": dyn(__APP_UID__),
                "runAsGroup": dyn(__APP_UID__),
                "runAsNonRoot": dyn(true),
                "allowPrivilegeEscalation": dyn(false),
                "readOnlyRootFilesystem": dyn(true),
                "seccompProfile": dyn({"type": dyn("RuntimeDefault")}),
                "capabilities": dyn({"drop": dyn(["ALL"]), "add": dyn(["SYS_PTRACE"])})
              }),
              "volumeMounts": dyn([
                dyn({"name": dyn("perf-scratch"), "mountPath": dyn("/perf")}),
                dyn({"name": dyn("perf-tmp"), "mountPath": dyn("/tmp")})
              ]),
              "env": dyn([
                dyn({"name": dyn("PERF_DIR"), "value": dyn("/perf")}),
                dyn({"name": dyn("PROFILE_SERVICE"), "valueFrom": dyn({"fieldRef": dyn({"fieldPath": dyn("metadata.labels['app']")})})}),
                dyn({"name": dyn("POD_NAMESPACE"), "valueFrom": dyn({"fieldRef": dyn({"fieldPath": dyn("metadata.namespace")})})}),
                dyn({"name": dyn("CLUSTER_NAME"), "value": dyn("__CLUSTER_NAME__")}),
                dyn({"name": dyn("PYROSCOPE_URL"), "value": dyn("__PYROSCOPE_URL__")})
              ]),
              "resources": dyn({
                "requests": dyn({"cpu": dyn("250m"), "memory": dyn("384Mi")}),
                "limits": dyn({"cpu": dyn("250m"), "memory": dyn("384Mi")})
              })
            })}
          ]
