# Privilege-free profiler-sidecar injection (Kyverno MutatingPolicy, CEL API).
#
# Opt in a workload by adding the pod-template label `perf-profile/sidecar: "true"`
# and doing a `kubectl rollout restart` — the one restart both injects the sidecar
# and gives a fresh baseline. No Deployment edit, no privileged/hostPID container:
# the sidecar uses only SYS_PTRACE + shareProcessNamespace and attaches
# async-profiler (ctimer + wall) across the shared PID namespace, pushing JFR to
# Pyroscope. The app image is untouched. Proven on Bottlerocket EKS Auto (K8s 1.34).
#
# Two CEL authoring gotchas this policy works around (both verified on-cluster):
#   1. patchType: ApplyConfiguration CANNOT set atomic fields (command,
#      securityContext.capabilities.add, env.valueFrom.fieldRef) -> use JSONPatch.
#   2. CEL will not widen heterogeneous map/list literals in a JSONPatch value
#      (it unifies value types eagerly) -> every value is wrapped in dyn(...).
#
# Prereq: Kyverno installed cluster-wide (preinstalled by the workshop bootstrap).
# failurePolicy: Ignore so a Kyverno outage never blocks app pods from scheduling.
apiVersion: policies.kyverno.io/v1beta1
kind: MutatingPolicy
metadata:
  name: inject-perf-profiler
spec:
  failurePolicy: Ignore
  # Only mutate Pods directly. Disable pod-controller autogen: our JSONPatch paths
  # are Pod-level (/spec/...), and autogen would also rerun them against Deployment
  # objects at /spec/template/spec/... and fail. Injection happens at Pod admission
  # (label + rollout restart), which is what we want.
  autogen:
    podControllers:
      controllers: ["none"]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
  matchConditions:
    - name: opted-in
      expression: >-
        has(object.metadata.labels) &&
        'perf-profile/sidecar' in object.metadata.labels &&
        object.metadata.labels['perf-profile/sidecar'] == 'true'
  variables:
    - name: fetchScript
      expression: >-
        [
          'set -e',
          'curl -sSL -o /ap/ap.tgz https://github.com/async-profiler/async-profiler/releases/download/v4.3/async-profiler-4.3-linux-x64.tar.gz',
          'tar -xz -C /ap --strip-components=1 -f /ap/ap.tgz',
          'rm -f /ap/ap.tgz',
          'ls -R /ap/bin /ap/lib'
        ].join('\n')
    - name: profilerScript
      expression: >-
        [
          'set -uo pipefail',
          'SVC=${PROFILE_SERVICE:-unknown}',
          'ENC=$(printf "%s{pod=%s,platform=eks-sidecar}" "${SVC}-eks" "$HOSTNAME" | sed -e "s/{/%7B/g" -e "s/}/%7D/g" -e "s/=/%3D/g" -e "s/,/%2C/g")',
          'AP=/ap',
          'echo "[pp] service=${SVC}-eks; waiting for target JVM..."',
          'PID=""',
          'while [ -z "$PID" ]; do for dd in /proc/[0-9]*; do [ -r "$dd/comm" ] || continue; if [ "$(cat "$dd/comm" 2>/dev/null)" = "java" ]; then PID="${dd#/proc/}"; break; fi; done; [ -z "$PID" ] && sleep 3; done',
          'echo "[pp] target pid=$PID"',
          'cp "$AP/lib/libasyncProfiler.so" "/proc/$PID/root/tmp/libasyncProfiler.so"',
          '"$AP/bin/asprof" stop --libpath /tmp/libasyncProfiler.so "$PID" 2>/dev/null || true',
          '"$AP/bin/asprof" start -e ctimer --wall 10ms -i 10ms -o jfr -f "/tmp/perf-$PID-%t.jfr" --loop 15s --libpath /tmp/libasyncProfiler.so "$PID" || "$AP/bin/asprof" start -e ctimer -i 10ms -o jfr -f "/tmp/perf-$PID-%t.jfr" --loop 15s --libpath /tmp/libasyncProfiler.so "$PID"',
          'echo "[pp] async-profiler attached"',
          'TMP="/proc/$PID/root/tmp"',
          'while [ -d "/proc/$PID" ]; do sleep 5; set -- $(ls -1 "$TMP"/perf-"$PID"-*.jfr 2>/dev/null | sort); [ "$#" -lt 2 ] && continue; last="${@: -1}"; for f in "$@"; do [ "$f" = "$last" ] && continue; sz=$(stat -c%s "$f" 2>/dev/null || echo 0); if [ "$sz" -gt 0 ]; then code=$(curl -s -o /dev/null -w %{http_code} -X POST -H "Content-Type: application/octet-stream" --data-binary @"$f" "$PYROSCOPE_URL/ingest?name=$ENC&format=jfr&spyName=javaspy" || echo 000); echo "[pp] pushed $(basename "$f") sz=$sz http=$code"; fi; rm -f "$f"; done; done',
          'echo "[pp] target gone"'
        ].join('\n')
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [
            JSONPatch{op: "add", path: "/spec/shareProcessNamespace", value: true},
            JSONPatch{op: "add", path: "/spec/volumes/-", value: dyn({
              "name": dyn("ap"), "emptyDir": dyn({})
            })},
            JSONPatch{op: "add", path: "/spec/initContainers", value: dyn([dyn({
              "name": dyn("fetch-asprof"),
              "image": dyn("curlimages/curl:latest"),
              "command": dyn(["/bin/sh", "-c", variables.fetchScript]),
              "volumeMounts": dyn([dyn({"name": dyn("ap"), "mountPath": dyn("/ap")})])
            })])},
            JSONPatch{op: "add", path: "/spec/containers/-", value: dyn({
              "name": dyn("perf-profiler"),
              "image": dyn("public.ecr.aws/docker/library/amazoncorretto:25"),
              "command": dyn(["/bin/bash", "-c", variables.profilerScript]),
              "securityContext": dyn({
                "runAsUser": dyn(0),
                "runAsNonRoot": dyn(false),
                "capabilities": dyn({"add": dyn(["SYS_PTRACE"])})
              }),
              "env": dyn([
                dyn({"name": dyn("PROFILE_SERVICE"), "valueFrom": dyn({"fieldRef": dyn({"fieldPath": dyn("metadata.labels['app']")})})}),
                dyn({"name": dyn("PYROSCOPE_URL"), "value": dyn("http://pyroscope.monitoring:4040")})
              ]),
              "volumeMounts": dyn([dyn({"name": dyn("ap"), "mountPath": dyn("/ap")})])
            })}
          ]
