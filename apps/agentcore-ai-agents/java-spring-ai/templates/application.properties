spring.application.name=agent
@@+create Logging and the Amazon Bedrock model: Claude Sonnet 4.6 through global cross-region inference
# Logging
logging.level.org.springframework.ai=DEBUG
logging.level.org.springaicommunity.agentcore=DEBUG
logging.level.com.example.agent=DEBUG
logging.pattern.console=%msg%n
# Amazon Bedrock
spring.ai.bedrock.aws.timeout=120s
spring.ai.bedrock.converse.chat.max-tokens=4096
spring.ai.bedrock.converse.chat.model=global.anthropic.claude-sonnet-4-6
@@-
@@+persona `temperature=0.7` balances creativity and consistency
spring.ai.bedrock.converse.chat.temperature=0.7
@@-
@@+memory The memory ID from `~/environment/.envrc`; auto-discovery finds the LTM strategies at startup

# AgentCore Memory
agentcore.memory.memory-id=${AGENTCORE_MEMORY_ID}
agentcore.memory.long-term.auto-discovery=true
@@-
@@+knowledge The Knowledge Base ID from `~/environment/.envrc`

# Knowledge Base
spring.ai.vectorstore.bedrock-knowledge-base.knowledge-base-id=${KNOWLEDGE_BASE_ID}
@@-
@@+browser Tool descriptions for the browser tools and the artifacts bucket from `~/environment/.envrc`

# AgentCore Browser - tool descriptions
agentcore.browser.browse-url-description=Browse a web page and extract its text content. Returns the page title and body text. Use this to read and extract data from websites. For interactive sites, combine with fillForm and clickElement to navigate, then call browseUrl again to read the results.
agentcore.browser.screenshot-description=Take a screenshot of a web page for the user to see. Does NOT return page content to you. Use browseUrl to extract data first, then takeScreenshot for visual evidence.

# Artifacts
app.artifacts.bucket=${ARTIFACTS_BUCKET}
@@-
@@+browser The travel portal URL from `~/environment/.envrc` for the system prompt

# Corporate travel portal
app.portal-url=${PORTAL_URL}
@@-
@@+mcp-client Gateway connection; `initialized=false` skips the `initialized` notification for stateless servers

# MCP Client
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.streamable-http.connections.gateway.url=${GATEWAY_URL}
@@-
@@+deploy The Cognito issuer from `~/environment/.envrc`; empty means no JWT check

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:}
@@-
@@+observability Spring Boot samples 10% of the requests by default: record every request; ADOT exports the traces, the OTLP metrics export of the starter stays off

# Tracing
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=false
@@-
@@+agent-as-tool The auditor harness from `~/environment/.envrc`; empty means no `check_compliance` tool

# Compliance auditor (agent as tool)
app.auditor.harness-arn=${AUDITOR_HARNESS_ARN:}
@@-
@@+guardrails The guardrail from `~/environment/.envrc`; without `GUARDRAIL_ID` the application runs without a guardrail

# Guardrail
app.guardrail.id=${GUARDRAIL_ID:}
app.guardrail.version=${GUARDRAIL_VERSION:DRAFT}
@@-
@@+identity The calendar API from `~/environment/.envrc` and the page AgentCore sends the browser to after the consent

# Corporate calendar (3LO)
app.calendar.url=${CALENDAR_URL:}
app.calendar.return-url=${OAUTH_RETURN_URL:http://localhost:8080/callback.html}
@@-
@@+policies The JWT Gateway from `~/environment/.envrc`; empty means all backoffice tools through the IAM Gateway

# JWT Gateway (backoffice tools with the user's token)
app.jwt-gateway.url=${JWT_GATEWAY_URL:}
@@-
@@+optimize The configuration bundle from `~/environment/.envrc`; empty means the system prompt in the code

# System prompt from the configuration bundle
app.config-bundle.id=${CONFIG_BUNDLE_ID:}
@@-
