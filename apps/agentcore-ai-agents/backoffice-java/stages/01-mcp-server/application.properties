spring.application.name=backoffice
# >> Port 8000: AgentCore Runtime expects MCP servers at `0.0.0.0:8000/mcp`
server.port=8000
# <<

# DynamoDB
spring.cloud.aws.dynamodb.table-prefix=backoffice-

# MCP Server
spring.ai.mcp.server.name=backoffice
spring.ai.mcp.server.version=1.0.0
# >> `STATELESS`: AgentCore Runtime requires stateless streamable HTTP and routes each session to its own microVM
spring.ai.mcp.server.protocol=STATELESS
# <<

# Logging
logging.level.org.springframework.ai=DEBUG
logging.level.io.modelcontextprotocol=DEBUG
