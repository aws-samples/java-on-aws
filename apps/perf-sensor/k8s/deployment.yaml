# perf-sensor Deployment + Service. Read-only, no AWS calls. Placeholders are substituted
# by deploy/java-on-amazon-eks/perf-sensor.sh:
#   __IMAGE__            the pushed image, pinned by digest
#   __NS__               the monitoring namespace
#   __REQUEST_PACKAGE__  the profiled app's request-path package (REQUIRED by the sensor)
# Reaches Prometheus, Pyroscope and the profiler sidecar /dump by pod IP; every endpoint
# is overridable via env (see src/main/resources/application.yaml for the full list).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perf-sensor
  namespace: __NS__
  labels: {app: perf-sensor}
spec:
  replicas: 1
  selector: {matchLabels: {app: perf-sensor}}
  template:
    metadata:
      labels: {app: perf-sensor}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: perf-sensor
      automountServiceAccountToken: true   # the K8s API is the sensor's data source
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: perf-sensor
          image: __IMAGE__
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: PROMETHEUS_URL, value: "http://prometheus-server.monitoring"}
            - {name: PYROSCOPE_URL, value: "http://pyroscope.monitoring:4040"}
            - {name: DUMP_PORT, value: "9100"}
            - {name: SERVICE_LABEL, value: "app"}
            - {name: REQUEST_PACKAGE, value: "__REQUEST_PACKAGE__"}
            - {name: PROFILED_POD_LABEL, value: "perf-profile/sidecar=true"}
            - {name: PROFILER_CONTAINER, value: "perf-profiler"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # JfrCollector writes the fetched ring here before parsing
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 24            # 120 s to boot
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits:   {cpu: "1",    memory: "1Gi"}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: perf-sensor, namespace: __NS__}
spec:
  selector: {app: perf-sensor}
  ports: [{port: 8080, targetPort: http, name: http}]
  type: ClusterIP
