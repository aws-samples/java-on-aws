# =============================================================================
# perf-sensor — Spring Boot 4 / Spring AI 2 MCP server (streamable-http) + REST.
# Deterministic sensors only: no Bedrock, no Spring AI chat, no AWS SDK.
#
# Environment (set in k8s/deployment.yaml by deploy/java-on-amazon-eks/perf-sensor.sh):
#   PROMETHEUS_URL       default http://prometheus-server.monitoring
#   PYROSCOPE_URL        default http://pyroscope.monitoring:4040
#   DUMP_PORT            profiler sidecar /dump port, default 9100
#   SERVICE_LABEL        pod label carrying the service name, default app
#   REQUEST_PACKAGE      REQUIRED — the app's request-path package (e.g. com.example.shop);
#                        a thread is "request path" when this package is on its stack
#   PROFILED_POD_LABEL   selector for pods whose startup the sensor publishes,
#                        default perf-profile/sidecar=true (the profiler opt-in label)
#   PROFILER_CONTAINER   sidecar container name to skip when finding the app container,
#                        default perf-profiler
# Contract: namespace == Deployment == app container == Pyroscope service_name (see README).
# =============================================================================
spring:
  application:
    name: perf-sensor
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: perf-sensor
        version: 1.0.0
        type: SYNC
        # Streamable-HTTP transport (endpoint /mcp). Tools come from the
        # ToolCallbackProvider bean in SensorApplication.
        protocol: STREAMABLE

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
