# Kyverno NamespacedValidatingPolicy — the manifest-checkable checklist items (1, 3, 9, 10)
# as admission rules for one namespace. GENERIC — replace <namespace>; keep the expressions
# verbatim.
#
# Kyverno evaluates the CEL expressions on every CREATE/UPDATE of a Deployment in the
# policy's own namespace and rejects a manifest that breaks a rule, with the rule's message.
# The policy is namespaced (policies.kyverno.io/v1, Kyverno 1.19+): the team that owns the
# namespace owns its rules, no cluster-admin needed. The runtime items (2, 4–8, 11, 12) need
# measurements and stay with the sensor.
#
# The checks mirror the sensor's own reading of the Deployment (K8sCollector) and the
# thresholds in checklist-rules.yaml, minus what only a running pod can tell (startup time
# vs the startup budget, GC pauses vs the liveness budget). They apply to the app container
# the sensor reads: the container named like the Deployment, else the first one; sidecars
# keep their own probes and lifecycle.
#   item 1   memory request == limit
#   item 3   no fixed heap (-Xmx / MaxHeapSize) in the JVM options env: the heap follows
#            the container limit (a CRaC image carries its heap in the checkpoint instead)
#   item 9   startupProbe and readinessProbe present; no initialDelaySeconds on startup or
#            readiness; liveness budget failureThreshold × periodSeconds >= 30 s; liveness
#            path != readiness path
#   item 10  a preStop hook, if any, is a plain sleep (the sleep action, sleep N or
#            sh -c "sleep N"), and terminationGracePeriodSeconds >= that sleep + 30 s
#            (Spring Boot's default drain, assumed)
#
# Kyverno also scans existing resources in the background and records the results in a
# PolicyReport in the namespace (kubectl get policyreport): a Deployment that was applied
# before the policy shows there, and its next update is denied until it passes.
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: java-on-eks
  namespace: <namespace>
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  variables:
    - name: containers
      expression: object.spec.template.spec.containers
    - name: app
      expression: >-
        variables.containers.exists(c, c.name == object.metadata.name)
          ? variables.containers.filter(c, c.name == object.metadata.name)[0]
          : variables.containers[0]
    - name: grace
      expression: >-
        has(object.spec.template.spec.terminationGracePeriodSeconds)
          ? object.spec.template.spec.terminationGracePeriodSeconds : 30
    # Seconds the preStop hook sleeps: 0 without a hook, -1 for a hook whose duration
    # cannot be read from the manifest.
    - name: preStop
      expression: >-
        !has(variables.app.lifecycle) || !has(variables.app.lifecycle.preStop) ? 0
        : has(variables.app.lifecycle.preStop.sleep) ? variables.app.lifecycle.preStop.sleep.seconds
        : !has(variables.app.lifecycle.preStop.exec) || !has(variables.app.lifecycle.preStop.exec.command) ? -1
        : size(variables.app.lifecycle.preStop.exec.command) == 2
            && variables.app.lifecycle.preStop.exec.command[0].matches('^(/usr)?(/bin/)?sleep$')
            && variables.app.lifecycle.preStop.exec.command[1].matches('^[0-9]+$')
          ? int(variables.app.lifecycle.preStop.exec.command[1])
        : size(variables.app.lifecycle.preStop.exec.command) == 3
            && variables.app.lifecycle.preStop.exec.command[0].matches('^(/usr)?(/bin/)?(sh|bash)$')
            && variables.app.lifecycle.preStop.exec.command[1] == '-c'
            && variables.app.lifecycle.preStop.exec.command[2].matches(r'^\s*sleep\s+[0-9]+\s*;?\s*$')
          ? int(variables.app.lifecycle.preStop.exec.command[2].find('[0-9]+'))
        : -1
  validations:
    - expression: >-
        has(variables.app.resources) && has(variables.app.resources.requests) && has(variables.app.resources.limits)
          && 'memory' in variables.app.resources.requests && 'memory' in variables.app.resources.limits
          && quantity(variables.app.resources.requests.memory).compareTo(quantity(variables.app.resources.limits.memory)) == 0
      message: "item 1: set resources.requests.memory equal to resources.limits.memory"
      reason: Invalid
    - expression: >-
        !has(variables.app.env) || variables.app.env.all(e,
          !(e.name in ['JAVA_TOOL_OPTIONS', 'JDK_JAVA_OPTIONS', 'JAVA_OPTS'])
          || !has(e.value) || !e.value.matches(r'-Xmx|MaxHeapSize='))
      message: "item 3: no -Xmx or -XX:MaxHeapSize in the JVM options, size the heap with -XX:MaxRAMPercentage"
      reason: Invalid
    - expression: >-
        has(variables.app.startupProbe) && has(variables.app.readinessProbe)
          && (!has(variables.app.startupProbe.initialDelaySeconds) || variables.app.startupProbe.initialDelaySeconds == 0)
          && (!has(variables.app.readinessProbe.initialDelaySeconds) || variables.app.readinessProbe.initialDelaySeconds == 0)
      message: "item 9: add a startupProbe and a readinessProbe, without initialDelaySeconds"
      reason: Invalid
    - expression: >-
        has(variables.app.livenessProbe)
          && (has(variables.app.livenessProbe.failureThreshold) ? variables.app.livenessProbe.failureThreshold : 3)
             * (has(variables.app.livenessProbe.periodSeconds) ? variables.app.livenessProbe.periodSeconds : 10) >= 30
      message: "item 9: give the livenessProbe a budget (failureThreshold × periodSeconds) of at least 30 s"
      reason: Invalid
    - expression: >-
        !(has(variables.app.livenessProbe) && has(variables.app.livenessProbe.httpGet) && has(variables.app.livenessProbe.httpGet.path)
          && has(variables.app.readinessProbe) && has(variables.app.readinessProbe.httpGet) && has(variables.app.readinessProbe.httpGet.path))
        || variables.app.livenessProbe.httpGet.path != variables.app.readinessProbe.httpGet.path
      message: "item 9: use different paths for the liveness and readiness probes"
      reason: Invalid
    - expression: variables.preStop >= 0
      message: "item 10: make the preStop hook a plain sleep (the sleep action, sleep N or sh -c \"sleep N\") so the shutdown budget can be checked"
      reason: Invalid
    - expression: variables.grace >= variables.preStop + 30
      message: "item 10: set terminationGracePeriodSeconds to at least the preStop sleep + 30 s"
      reason: Invalid
