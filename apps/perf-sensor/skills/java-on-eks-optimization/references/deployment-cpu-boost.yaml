# In-place CPU boost fragment (no image/code change). GENERIC — replace <app>,
# <namespace>, and the boot/steady CPU values. Boot at a higher CPU (roughly halves
# startup), then resize CPU DOWN to steady once the pod is Ready — 0 restarts.
#
# 1) In the app's k8s/deployment.yaml, declare a CPU resizePolicy on the app
#    container so CPU changes need no restart, and set the boot CPU:
        # container: <app>
        resizePolicy:
          - resourceName: cpu
            restartPolicy: NotRequired
        resources:
          requests:
            cpu: "<boot.cpu>"              # e.g. 2 — higher, for boot
            memory: "<keep current>"
          limits:
            cpu: "<boot.cpu>"
            memory: "<keep current>"
#
# 2) kubectl -n <namespace> apply -f k8s/deployment.yaml   # rolls once to add the resizePolicy
#
# 3) After the new pod is Ready, resize CPU IN PLACE to steady (send the FULL
#    resources map — cpu AND memory — or the API rejects it):
#    POD=$(kubectl -n <namespace> get pod -l app=<app> -o jsonpath='{.items[0].metadata.name}')
#    kubectl -n <namespace> patch pod "$POD" --subresource resize --type merge -p \
#      '{"spec":{"containers":[{"name":"<app>","resources":{"requests":{"cpu":"<steady.cpu>","memory":"<keep current>"},"limits":{"cpu":"<steady.cpu>","memory":"<keep current>"}}}]}}'
#
# NOTE: step 3 is a MANUAL, per-pod resize (fine for a demo / a single pod). In
# production, do NOT hand-resize every pod — use the Kube Startup CPU Boost
# controller (github.com/google/kube-startup-cpu-boost), which boosts CPU at boot
# and resizes back down automatically once the pod is Ready, across the whole
# Deployment. The resizePolicy above is the prerequisite either way.
