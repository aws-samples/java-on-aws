# Memory right-sizing fragment. GENERIC — the VALUES come from perf-sensor.sizeMemory
# (requests.memory == limits.memory, gc, maxRamPercentage, initialRamPercentage); do not
# invent them. Apply under spec.template.spec.containers[0] in the app's
# k8s/deployment.yaml, replacing <app> with the container name. Changes ONLY memory +
# JAVA_TOOL_OPTIONS and PRESERVES the current CPU values, so it composes with the CPU
# fragments in either order. A memory-limit change needs a rollout restart.
        # container: <app>
        resources:
          requests:
            cpu: "<keep current>"          # unchanged
            memory: "<sizeMemory.requests.memory>"   # == limits, e.g. 768Mi
          limits:
            cpu: "<keep current>"          # unchanged
            memory: "<sizeMemory.limits.memory>"     # e.g. 768Mi
        env:
          # The value holds JVM options only: a "#" inside the folded scalar would be passed to
          # the JVM. GC: SerialGC on <= 1 vCPU, never G1 there. MaxRAMPercentage: heap ceiling as
          # a share of the limit, e.g. 75. InitialRAMPercentage: start near the steady size, e.g. 50.
          - name: JAVA_TOOL_OPTIONS
            value: >-
              -XX:+Use<sizeMemory.gc>
              -XX:MaxRAMPercentage=<sizeMemory.maxRamPercentage>
              -XX:InitialRAMPercentage=<sizeMemory.initialRamPercentage>
